<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>ORA Salamanca · Eurostars Las Claras</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#0f172a}
#map{position:absolute;inset:0}
.bar,.panel{position:absolute;z-index:1000;left:12px;right:12px;background:#ffffffee;backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.bar{top:12px;padding:10px 12px}
.panel{bottom:12px;padding:12px;max-height:42vh;overflow:auto}
h1{margin:0;font-size:15px}
.sub{margin:4px 0 0;font-size:12px;color:#475569}
.legend,.rows,.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.legend{font-size:12px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.chip{font-size:11px;padding:6px 9px;border-radius:999px;background:#f1f5f9}
.chip.g{background:#dcfce7;color:#14532d}
.chip.h{background:#fee2e2;color:#7f1d1d}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;background:#0f172a;color:#fff;text-decoration:none}
.btn.s{background:#e2e8f0;color:#0f172a}
.note{margin-top:8px;font-size:11px;color:#475569;line-height:1.4}
</style>
</head>
<body>
<div id="map"></div>
<header class="bar">
  <h1>ORA cerca de Eurostars Las Claras</h1>
  <p class="sub">Sábado ~10:00 · ORA 9:00–14:00 · tarde y domingo gratis</p>
</header>
<section class="panel">
  <div class="legend">
    <span><i class="sw" style="background:rgba(34,197,94,.45);border:1px solid #16a34a"></i>Zona A</span>
    <span><i class="sw" style="background:rgba(59,130,246,.45);border:1px solid #2563eb"></i>Zona B</span>
    <span><i class="sw" style="background:#dc2626"></i>Hotel</span>
  </div>
  <div class="rows" id="streets"></div>
  <div class="acts">
    <a class="btn" id="go" href="#">Cómo llegar</a>
    <button class="btn s" id="rec" type="button">Centrar hotel</button>
  </div>
  <p class="note" id="note"></p>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const H={lat:40.9610433,lon:-5.661391,name:"Eurostars Las Claras",addr:"C/ Marquesa de Almarza, s/n, 37001 Salamanca"};
const GREEN=["Huertas de la Trinidad","De las Huertas","Cordel de Merinas","Jardines","Bailén","Ballesta","Plaza de la Fontana","Av. Reyes de España","Paseo Rector Esperabé (pares)","San Gregorio","Santa Brígida"];
const ORA=PLACEHOLDER_ORA;
const map=L.map("map",{zoomControl:false}).setView([H.lat,H.lon],16);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OSM · ORA Ayto. Salamanca"}).addTo(map);
function st(f){const n=((f.properties&&f.properties.name)||"").toUpperCase();const a=n.includes("A");return{color:a?"#16a34a":"#2563eb",weight:1.5,fillColor:a?"#22c55e":"#3b82f6",fillOpacity:.28};}
L.marker([H.lat,H.lon],{icon:L.divIcon({className:"",html:'<div style="width:18px;height:18px;border-radius:50%;background:#dc2626;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map)
  .bindPopup(`<strong>${H.name}</strong><br>${H.addr}<br><em>Verde ≈ 5 h · Azul ≈ 2 h</em>`);
L.geoJSON(ORA,{style:st,onEachFeature:(f,l)=>{const p=f.properties||{};l.bindPopup(`<strong>${p.name||"Zona ORA"}</strong><br>${p.nplazas!=null?p.nplazas+" plazas":""}`);}}).addTo(map);
document.getElementById("streets").innerHTML='<span class="chip h">Hotel</span>'+GREEN.map(s=>`<span class="chip g">${s}</span>`).join("");
document.getElementById("note").textContent="El GeoJSON oficial NO distingue verde vs azul: solo Zona A / Zona B. Las calles verdes son orientación práctica; confirma señalización. Fuente: opendata/IDE Ayto. Salamanca.";
document.getElementById("rec").onclick=()=>map.setView([H.lat,H.lon],16);
document.getElementById("go").href=`https://www.google.com/maps/dir/?api=1&destination=${H.lat},${H.lon}&travelmode=driving`;
</script>
</body>
</html>
