<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ORA Salamanca · Eurostars Las Claras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --ink:#0f172a; --muted:#475569; --panel:#ffffffee; --green:#16a34a; --blue:#2563eb; --zoneA:#22c55e; --zoneB:#3b82f6; --hotel:#dc2626;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:#0b1220; }
    #map { position:absolute; inset:0; }
    .topbar {
      position:absolute; z-index:1000; left:12px; right:12px; top:12px;
      background:var(--panel); backdrop-filter:blur(10px); border-radius:14px;
      padding:10px 12px; box-shadow:0 8px 28px rgba(0,0,0,.18);
    }
    .topbar h1 { margin:0; font-size:15px; line-height:1.25; }
    .topbar p { margin:4px 0 0; font-size:12px; color:var(--muted); line-height:1.35; }
    .panel {
      position:absolute; z-index:1000; left:12px; right:12px; bottom:12px;
      background:var(--panel); backdrop-filter:blur(10px); border-radius:14px;
      padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.18); max-height:42vh; overflow:auto;
    }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .chip { font-size:11px; padding:6px 9px; border-radius:999px; background:#f1f5f9; color:#0f172a; }
    .chip.green { background:#dcfce7; color:#14532d; }
    .chip.blue { background:#dbeafe; color:#1e3a8a; }
    .chip.hotel { background:#fee2e2; color:#7f1d1d; }
    .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:12px; }
    .swatch { width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px; }
    .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .btn {
      appearance:none; border:0; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600;
      background:#0f172a; color:#fff; text-decoration:none; display:inline-flex; align-items:center;
    }
    .btn.secondary { background:#e2e8f0; color:#0f172a; }
    .note { margin-top:8px; font-size:11px; color:var(--muted); line-height:1.4; }
    .leaflet-control-attribution { font-size:9px !important; }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Mapa zona ORA Salamanca"></div>
  <header class="topbar">
    <h1>ORA cerca de Eurostars Las Claras</h1>
    <p>Sábado ~10:00 · regulación ORA 9:00–14:00 · tarde y domingo gratis</p>
  </header>
  <section class="panel" aria-label="Leyenda y calles verdes">
    <div class="legend">
      <span><i class="swatch" style="background:rgba(34,197,94,.45);border:1px solid #16a34a"></i>Zona A (dato oficial)</span>
      <span><i class="swatch" style="background:rgba(59,130,246,.45);border:1px solid #2563eb"></i>Zona B (dato oficial)</span>
      <span><i class="swatch" style="background:#dc2626"></i>Hotel</span>
    </div>
    <div class="row" id="streets"></div>
    <div class="actions">
      <a class="btn" id="navHotel" href="#">Cómo llegar al hotel</a>
      <button class="btn secondary" id="recenter" type="button">Centrar hotel</button>
    </div>
    <p class="note" id="dataNote"></p>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>

50932,40.96969254],[-5.6647834,40.96980674],[-5.664436,40.96987474],[-5.6641036,40.96989934],[-5.6636583,40.96995194],[-5.6633931,40.97006444]]]]},"geometry_name":"geom","properties":{"name":"Zona  A","nplazas":590},"bbox":[-5.6748995,40.95803034,-5.6577241,40.97006444]},{"type":"Feature","id":"t02_zona_ora_actual.2","geometry":{"type":"MultiPolygon","coordinates":[[[[-5.66810331,40.96778642],[-5.6691538,40.96903334],[-5.6692531,40.96901514],[-5.6695481,40.96936954],[-5.6694274,40.96939784],[-5.6703025,40.97062734],[-5.6701121,40.97077114],[-5.6687759,40.97077834],[-5.6682516,40.97071764],[-5.6681912,40.97078344],[-5.6676333,40.97071864],[-5.6674724,40.97084824],[-5.667682,40.97213614],[-5.6675324,40.97224444],[-5.6636576,40.97045914],[-5.663377,40.97189174],[-5.6632187,40.97249524],[-5.6631039,40.97280594],[-5.6627042,40.97524814],[-5.6625053,40.97589674],[-5.6621651,40.97594064],[-5.661583,40.97629504],[-5.6609983,40.97667784],[-5.6602169,40.97636274],[-5.6586702,40.97582654],[-5.6559607,40.97484474],[-5.6560439,40.97473234],[-5.6581252,40.97129774],[-5.6578856,40.97123854],[-5.657152,40.97107554],[-5.6569844,40.97106334],[-5.6539991,40.97042644],[-5.6537693,40.97037024],[-5.6536245,40.97021224],[-5.6542064,40.97000314],[-5.6548348,40.96974944],[-5.6573689,40.96889184],[-5.6580584,40.96863594],[-5.6586027,40.96838954],[-5.658909,40.96849054],[-5.6592509,40.96868494],[-5.659487,40.96883174],[-5.6598142,40.96903124],[-5.6600866,40.96918184],[-5.6604339,40.96930444],[-5.6617695,40.96962684],[-5.663073,40.96995704],[-5.6633931,40.97006444],[-5.6636583,40.96995194],[-5.664436,40.96987474],[-5.6647834,40.96980674],[-5.6650932,40.96969254],[-5.6654197,40.96953354],[-5.6667938,40.96876334],[-5.6673222,40.96839274],[-5.66810331,40.96778642]]]]},"geometry_name":"geom","properties":{"name":"Zona  B","nplazas":2211},"bbox":[-5.6703025,40.96778642,-5.6536245,40.97667784]}],"totalFeatures":2,"numberMatched":2,"numberReturned":2,"timeStamp":"2026-09-18T17:48:42.854Z","crs":{"type":"name","properties":{"name":"urn:ogc:def:crs:EPSG::4326"}},"bbox":[-5.6748995,40.95803034,-5.6536245,40.97667784]};
    const PARK_NEAR = {"type":"FeatureCollection","features":[]};
    // Calles verdes cercanas (ampliación jul 2026 / listado práctico — no vienen coloreadas en el GeoJSON oficial)
    const GREEN_STREETS = [
      "Huertas de la Trinidad", "De las Huertas", "Cordel de Merinas", "Jardines",
      "Bailén", "Ballesta", "Plaza de la Fontana", "Av. Reyes de España",
      "Paseo Rector Esperabé (pares)", "San Gregorio", "Santa Brígida"
    ];

    const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([HOTEL.lat, HOTEL.lon], 16);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap · ORA Ayto. Salamanca"
    }).addTo(map);

    function zoneStyle(feature) {
      const n = (feature.properties && feature.properties.name || "").toUpperCase();
      const isA = n.includes("A");
      return {
        color: isA ? "#16a34a" : "#2563eb",
        weight: 1.5,
        fillColor: isA ? "#22c55e" : "#3b82f6",
        fillOpacity: 0.28
      };
    }

    const oraLayer = L.geoJSON(ORA, {
      style: zoneStyle,
      onEachFeature: (f, layer) => {
        const p = f.properties || {};
        layer.bindPopup(`<strong>${p.name || "Zona ORA"}</strong><br>${p.nplazas != null ? p.nplazas + " plazas (dato capa)" : ""}`);
      }
    }).addTo(map);

    if (PARK_NEAR.features && PARK_NEAR.features.length) {
      L.geoJSON(PARK_NEAR, {
        style: { color: "#64748b", weight: 3, opacity: 0.55 },
        onEachFeature: (f, layer) => {
          const n = (f.properties && f.properties.nombre) || "Aparcamiento fuera ORA";
          layer.bindPopup(`<strong>Fuera ORA</strong><br>${n}`);
        }
      }).addTo(map);
    }

    const hotelIcon = L.divIcon({
      className: "",
      html: `<div style="width:18px;height:18px;border-radius:50%;background:#dc2626;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>`,
      iconSize: [18,18], iconAnchor: [9,9]
    });
    const hotelMarker = L.marker([HOTEL.lat, HOTEL.lon], { icon: hotelIcon }).addTo(map);
    hotelMarker.bindPopup(`<strong>${HOTEL.name}</strong><br>${HOTEL.addr}<br><em>Verde ORA ≈ máx. 5 h · Azul ≈ máx. 2 h</em>`);

    const streetBox = document.getElementById("streets");
    streetBox.innerHTML = `<span class="chip hotel">Hotel</span>` + GREEN_STREETS.map(s => `<span class="chip green">${s}</span>`).join("");

    const props = (ORA.features || []).map(f => (f.properties && f.properties.name) || "");
    document.getElementById("dataNote").textContent =
      "El GeoJSON oficial (WFS t02_zona_ora_actual) NO distingue plazas verdes vs azules: solo polígonos Zona A / Zona B (" +
      props.join(", ") +
      "). Las calles en verde de la lista son orientación práctica cerca del hotel; confirma señalización in situ. Fuente: opendata / IDE Ayto. Salamanca. Capas grises cercanas = tramos fuera ORA si hay dato.";

    document.getElementById("recenter").onclick = () => map.setView([HOTEL.lat, HOTEL.lon], 16);
    document.getElementById("navHotel").href =
      `https://www.google.com/maps/dir/?api=1&destination=${HOTEL.lat},${HOTEL.lon}&travelmode=driving`;

    // Fit gently around hotel + nearby ora if intersects
    try {
      const b = L.latLngBounds([[HOTEL.lat, HOTEL.lon]]);
      oraLayer.eachLayer(l => { if (l.getBounds) b.extend(l.getBounds()); });
      // keep focus near hotel rather than whole city
      map.setView([HOTEL.lat, HOTEL.lon], 16);
    } catch (e) {}
  </script>
</body>
</html>
